<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/html.style.css">
  <title>Page Not Found</title>
  <style>
    .error-page {
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="stack">
      <h1 style="font-size: var(--text-heading-3xl); margin: 0;">404</h1>
      <p style="font-size: var(--text-heading-lg); color: var(--color-text-secondary);">
        Page not found
      </p>
      <p>
        The page you're looking for doesn't exist or has been moved.
      </p>
      <a href="/" style="display: inline-block; margin-block-start: var(--space-block);">
        <button>Go Home</button>
      </a>
    </div>
  </main>
</body>
</html>
