name: Update visual snapshots (temporary)

on:
  pull_request:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual/components.spec.js --update-snapshots=all || true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual/components.spec.js-snapshots/
