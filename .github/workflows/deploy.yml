name: Deploy to Cloudflare Pages

on:
  # Push to main only. Pull requests are tested by pr-pipeline.yml, which calls
  # the same test workflow after review and security scans.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # One deploy at a time. Two merges in quick succession would otherwise race,
    # and the loser could land after the winner and publish the older commit.
    # Never cancel in progress: a half-finished deploy is worse than a queued one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=html-style
          workingDirectory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}