name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Pull requests run the test job only. Without this, a branch got no Linux
  # verification at all and the merge to main was its first real test run —
  # on the same trigger that publishes the site.
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install  # Changed from npm ci to npm install to generate package-lock.json if missing

      # Must run after `npm install`: build.js bundles components with esbuild.
      # Still ahead of the browser download, so a stale dist/ fails fast.
      - name: Verify build output is in sync
        run: npm run build:check

      # Needs dist/custom-elements.json, so it runs after the build check.
      - name: Verify documentation is current
        run: npm run docs:check

      # Generated declarations are the kind of thing that rots silently: nothing
      # errors when they are wrong, consumers just get bad autocomplete. This
      # compiles a consumer-style fixture against them. Needs the build above,
      # and no browser, so it runs before the download.
      - name: Verify the generated type declarations compile
        run: npm run types:check

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run tests
        run: npm test

  deploy:
    # Push to main only. Pull requests stop after `test`, so a PR is verified
    # without publishing anything.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    # One deploy at a time. Two merges in quick succession would otherwise race,
    # and the loser could land after the winner and publish the older commit.
    # Never cancel in progress: a half-finished deploy is worse than a queued one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=html-style
          workingDirectory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}