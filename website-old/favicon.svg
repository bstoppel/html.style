<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root {
      --bg: oklch(0.98 0 0);
      --fg: oklch(0.15 0 0);
      --accent: oklch(0.6 0.18 260);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(0.15 0 0);
        --fg: oklch(0.98 0 0);
        --accent: oklch(0.7 0.2 260);
      }
    }

    rect.bg { fill: var(--bg); }
    text {
      fill: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
    }
    .dot { fill: var(--accent); }
  </style>

  <!-- Background -->
  <rect class="bg" width="100" height="100" rx="18"/>

  <!-- "h.s" text -->
  <text x="12" y="70" font-size="56">h</text>
  <circle class="dot" cx="48" cy="62" r="6"/>
  <text x="58" y="70" font-size="56">s</text>
</svg>
